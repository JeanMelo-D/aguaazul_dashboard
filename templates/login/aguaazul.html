<!DOCTYPE html>
<html lang="pt-br" data-theme="halloween">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Água Azul </title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />

    
    <style type="text/tailwindcss">
        body {
            /* Define a sua imagem como fundo */
            background-image: url('https://storagemapeamentos.blob.core.windows.net/assets/logos/aguaazul-login-tela');
            
            /* Garante que a imagem cubra toda a tela */
            background-size: cover;
            
            /* Centraliza a imagem */
            background-position: center;
            
            /* Evita que a imagem se repita */
            background-repeat: no-repeat;
            
        }
        
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md border shadow-xl card bg-base-100/10 backdrop-blur-lg border-base-100/20">
        <div class="p-9"> 
            <img src="https://storagemapeamentos.blob.core.windows.net/assets/logos/aguaazul-login.svg" alt="logo-aguaazul" class="mx-auto mt-4 mb-4 w-52"> 
        </div>
        <h1 class="mb-6 text-6xl font-bold text-center text-transparent size-25 pb-14 bg-clip-text bg-gradient-to-r from-gray-900 via-blue-500 to-gray-900 animate-text-gradiente">
            Login
        </h1>
        {% if messages %}
    <div role="alert" class="mb-4 shadow-lg alert alert-error">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 stroke-current shrink-0" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        
        {% for message in messages %}
            <span>{{ message }}</span>
        {% endfor %}
        </div>
         {% endif %}
            
            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}
                <div class="gap-4 p-4 form-control">
                    <label class="flex items-center gap-2 input input-bordered bg-white/10">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4 opacity-70">     
                            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12.735 14c.618 0 1.093-.561.872-1.139a6.002 6.002 0 0 0-11.215 0c-.22.578.254 1.139.872 1.139h9.47Z" /></svg>
                       
                            <input type="text" name="username" placeholder="Usuário" ... />
                    </label>
                    
                    <label class="flex items-center gap-2 input input-bordered bg-white/10">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4 opacity-70"><path fill-rule="evenodd" d="M14 6a4 4 0 0 1-4.899 3.899l-1.955 1.955a.5.5 0 0 1-.353.146H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2.293a.5.5 0 0 1 .146-.353l3.955-3.955A4 4 0 1 1 14 6Zm-4-2a.75.75 0 0 0 0 1.5.5.5 0 0 1 .5.5.75.75 0 0 0 1.5 0 2 2 0 0 0-2-2Z" clip-rule="evenodd" /></svg>
                        <input type="password" name="password" placeholder="Senha" ... />
                    </label>
                </div>
                
                <div class="flex items-center justify-between mt-4 text-sm">
                    <div class="p-4 form-control">
                        <label class="gap-2 cursor-pointer label">
                            <input type="checkbox" class="checkbox checkbox-sm" />
                            <span class="text-white label-text">Lembrar</span> 
                        </label>
                    </div>
                    <a href="#" class="p-4 text-white link link-hover" >Esqueceu a senha?</a>
                </div>
                
                <div class="p-4 mt-6 form-control">
                    <button type="submit" 
            class="flex items-center gap-3 text-lg font-bold text-white border-none btn bg-gradient-to-r from-gray-900 via-blue-500 to-gray-900 animate-bg-gradient">
        Entrar
        <img src="https://cdn-icons-png.flaticon.com/128/5501/5501389.png" alt="" class="w-6 h-6">
    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
