{% load static %}

<aside 
    x-data="{ sidebarOpen: true }"
    class="sticky top-0 flex flex-col h-screen transition-all duration-300 ease-in-out shadow-1xl bg-base-100 shadow-primary"
    :class="sidebarOpen ? 'w-64' : 'w-20'"> 
    <div class="flex items-center h-16 border-b border-base-200" :class="sidebarOpen ? 'justify-between p-4' : 'justify-center py-4'">
        <div class="flex items-center gap-3 overflow-hidden" x-show="sidebarOpen" x-transition:enter="transition-all ease-in-out duration-300" x-transition:enter-start="opacity-0 max-w-0" x-transition:enter-end="opacity-100 max-w-xs" x-transition:leave="transition-all ease-in-out duration-150" x-transition:leave-start="opacity-100 max-w-xs" x-transition:leave-end="opacity-0 max-w-0">
            <i data-lucide="layout-dashboard" class="flex-shrink-0 text-primary"></i>
            <h1 class="text-xl font-bold text-primary whitespace-nowrap">Água Azul</h1>
        </div>
        <button @click="sidebarOpen = !sidebarOpen" class="btn btn-ghost btn-square">
            <i data-lucide="chevrons-left" class="transition-transform duration-300" :class="{ 'rotate-180': !sidebarOpen }"></i>
        </button>
    </div>

    <ul class="flex-grow p-2 menu text-base-content">
        <li class="transition-opacity duration-300 menu-title" :class="!sidebarOpen && 'opacity-0 pointer-events-none'">
            <span class="px-0">Principal</span>
        </li>
        
        <li>
            <details open>
                <summary>
                    <span class="flex items-center gap-3">
                        <i data-lucide="leaf" class="text-success"></i>
                        <span x-show="sidebarOpen" x-transition:enter="transition-all duration-200 ease-out" x-transition:enter-start="opacity-0 -translate-x-3" x-transition:enter-end="opacity-100 translate-x-0" x-transition:leave="transition-all duration-100 ease-in" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">Agrícola</span>
                    </span>
                    <i data-lucide="chevron-down" class="transition-all duration-300 details-open:-rotate-180" :class="!sidebarOpen && 'opacity-0'"></i>
                </summary>
                <ul x-show="sidebarOpen" x-transition>
                    <li><a href="{% url 'home' %}">Colheita</a></li>
                    <li><a href="{% url 'maps' %}">Mapas</a></li>
                </ul>
            </details>
        </li>

        <li>
            <details open>
                <summary>
                    <span class="flex items-center gap-3">
                        <i data-lucide="dollar-sign" class="text-warning"></i>
                        <span x-show="sidebarOpen" x-transition:enter="transition-all duration-200 ease-out" x-transition:enter-start="opacity-0 -translate-x-3" x-transition:enter-end="opacity-100 translate-x-0" x-transition:leave="transition-all duration-100 ease-in" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">Analytics</span>
                    </span>
                    <i data-lucide="chevron-down" class="transition-all duration-300 details-open:-rotate-180" :class="!sidebarOpen && 'opacity-0'"></i>
                </summary>
                <ul x-show="sidebarOpen" x-transition>
                    <li><a href="{% url 'fluxo_caixa:dashboard' %}">Financeiro</a></li>
                </ul>
            </details>
        </li>

        <li class="transition-opacity duration-300 menu-title" :class="!sidebarOpen && 'opacity-0 pointer-events-none'">
             <span class="px-0">Relatórios</span>
        </li>

        <li>
            <a class="flex items-center gap-3">
                <i data-lucide="users"></i>
                <span x-show="sidebarOpen" x-transition:enter="transition-all duration-900 ease-out" x-transition:enter-start="opacity-0 -translate-x-3" x-transition:enter-end="opacity-100 translate-x-0" x-transition:leave="transition-all duration-100 ease-in" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">Funcionários</span>
            </a>
        </li>
        <li>
            <a class="flex items-center gap-3">
                <i data-lucide="shopping-cart"></i>
                <span x-show="sidebarOpen" x-transition:enter="transition-all duration-900 ease-out" x-transition:enter-start="opacity-0 -translate-x-3" x-transition:enter-end="opacity-100 translate-x-0" x-transition:leave="transition-all duration-100 ease-in" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">Fornecedores</span>
            </a>
        </li>
    </ul>

    <div class='p-15'>
        <label class="flex gap-2 cursor-pointer">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              
            </svg>
            <input type="checkbox" value="fantasy" class="toggle theme-controller" />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="12" cy="12" r="5" />
              <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
              
            </svg>
          </label>
    </div>      

    <div class="p-2 mt-auto border-t border-base-200">
         
        <div class="w-full dropdown dropdown-top dropdown-end">
            <div tabindex="0" role="button" class="flex items-center justify-start w-full p-2 btn btn-ghost" :class="!sidebarOpen && 'justify-center'">
                <div class="avatar">
                    <div class="w-10 rounded-full ring ring-primary ring-offset-2 ring-offset-base-100">
                        <img alt="Foto do Usuário" src="https://placehold.co/100x100/3B82F6/FFFFFF?text={{ user.username|first|upper }}" />
                    </div>
                </div>
                <div x-show="sidebarOpen" class="flex-grow ml-3 overflow-hidden text-left whitespace-nowrap" x-transition:enter="transition-all ease-in-out duration-300" x-transition:enter-start="opacity-0 max-w-0" x-transition:enter-end="opacity-100 max-w-xs" x-transition:leave="transition-all ease-in-out duration-150" x-transition:leave-start="opacity-100 max-w-xs" x-transition:leave-end="opacity-0 max-w-0">
                    <p class="font-bold truncate">{{ user.get_full_name|default:user.username }}</p>
                    <p class="text-xs truncate text-base-content/60">{{ user.email }}</p>
                </div>
            </div>
            <ul tabindex="0" class="menu dropdown-content z-[1] w-52 rounded-box bg-base-100 p-2 shadow-xl">
                <li><a><i data-lucide="user-circle" class="w-4 h-4"></i>Perfil</a></li>
                <div class="my-1 divider"></div>
                <li><a href="{% url 'logout' %}" class="text-error"><i data-lucide="log-out" class="w-4 h-4"></i>Sair</a></li>
            </ul>
        </div>
    </div>
</aside>
